<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gradOrb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A4EF"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)"/>
  
  <!-- Outer Stopwatch Ring -->
  <circle cx="256" cy="270" r="160" fill="none" stroke="#334155" stroke-width="14"/>
  <circle cx="256" cy="270" r="160" fill="none" stroke="#0078D4" stroke-width="14" stroke-dasharray="750 260" stroke-linecap="round"/>
  
  <!-- Stopwatch Top Button -->
  <rect x="236" y="64" width="40" height="32" rx="8" fill="#64748B"/>
  <rect x="220" y="52" width="72" height="16" rx="6" fill="#94A3B8"/>
  
  <!-- Center Ambient Status Orb -->
  <circle cx="256" cy="270" r="54" fill="url(#gradOrb)" filter="url(#glow)"/>
  <circle cx="256" cy="270" r="54" fill="#0078D4"/>
  <circle cx="256" cy="270" r="20" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Clock Hands -->
  <line x1="256" y1="270" x2="256" y2="160" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="270" x2="330" y2="270" stroke="#00A4EF" stroke-width="8" stroke-linecap="round"/>
</svg>
